# GPTQ as llm-compressor 0.15 runs it: Qwen3-8B, W4A16 symmetric, group 128.
# qda build bench/gptq-w4a16.yaml --set calib.file.path=CALIB.jsonl --set out=DIR
model: Qwen/Qwen3-8B
format: w4a16-sym-g128
steps:
  - gptq: {actorder: static, damp: 0.01, block: 128}
calib: {file: {path: calib.jsonl, samples: 128, seqlen: 2048}}
