# HMMT February 2026 as the paper asked and graded it (paper.py): MathArena's prompt, exact symbolic equivalence
# of the closed-form answer. Pinned to the revision the paper read; a later one rewords problem 25.
task: paper_hmmt_feb_2026
dataset_path: MathArena/hmmt_feb_2026
dataset_kwargs:
  revision: 02fba4f74d8e68e73e66a02d540fd979c05c274c
output_type: generate_until
test_split: train
process_docs: !function paper.hmmt_docs
doc_to_text: prompt
doc_to_target: gold
process_results: !function paper.hmmt_results
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
generation_kwargs:
  until: []
  do_sample: false
  temperature: 0.0
  max_gen_toks: 32768
num_fewshot: 0
metadata:
  version: 1.0
