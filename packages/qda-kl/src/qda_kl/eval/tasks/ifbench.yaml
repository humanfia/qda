# IFBench with AllenAI's official checkers (vendored under qda_kl/third_party/ifbench, Apache-2.0). lm-eval
# ships no IFBench task, and its instruction registry lacks all 58 of IFBench's instruction ids. The test set is
# downloaded at the pinned revision and never committed; the paper reports prompt-level loose accuracy.
task: ifbench
dataset_path: allenai/IFBench_test
dataset_kwargs:
  revision: 2e8a48de45ff3bf41242f927254ca81b59ca3ae2
output_type: generate_until
training_split: train
test_split: train
num_fewshot: 0
doc_to_text: prompt
doc_to_target: 0
process_results: !function ifbench.process_results
metric_list:
  - metric: prompt_level_loose_acc
    aggregation: mean
    higher_is_better: true
  - metric: prompt_level_strict_acc
    aggregation: mean
    higher_is_better: true
  - metric: instruction_level_loose_acc
    aggregation: !function ifbench.weighted_ratio
    higher_is_better: true
  - metric: instruction_level_strict_acc
    aggregation: !function ifbench.weighted_ratio
    higher_is_better: true
  - metric: checker_errors
    aggregation: mean
    higher_is_better: false
generation_kwargs:
  until:
    - "</s>"
    - "<|im_end|>"
    - "<|eot_id|>"
  do_sample: false
  temperature: 0.0
  max_gen_toks: 32768
metadata:
  version: 1.0
