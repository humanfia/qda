[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qda-quant"
version = "0.1.0"
description = "Composable post-training quantization for LLMs: fast builds, served by stock vLLM"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "torch>=2.9",
    "transformers>=5.14",
    "safetensors",
    "accelerate",
    "pydantic>=2",
    "pyyaml",
    "numpy",
    # GDN layers (Qwen3.5/3.6/3.8) calibrate through fla's kernels; without it transformers silently falls back
    # to its torch reference, which is several times slower. Installed by default, pinned: the Triton kernels are
    # the fast path and a minor bump changes what runs.
    "fla-core==0.6.0",
    "flash-linear-attention==0.6.0",
]

[project.urls]
Repository = "https://github.com/humanfia/qda"
Documentation = "https://github.com/humanfia/qda/tree/main/docs"

[project.optional-dependencies]
hf = ["pyarrow", "datasets>=3"]  # calib source `hf`: a dataset's own parquet; datasets: `qda data public`
gguf = ["gguf>=0.19", "sentencepiece"]  # exporter `gguf`; its converter is llama.cpp's checkout at the pinned commit
llmc = ["llmcompressor>=0.15"]  # baselines / comparison only; conflicts with vLLM
vllm = ["vllm==0.33.0"]  # calib source `selfgen`: the model's own answers, generated in a child process; needs Python 3.11
vlm = ["torchvision", "pillow", "pyarrow"]  # calib source `vlm`: the model's processor, image decoding, parquet
dev = ["pytest", "ruff", "pillow", "pyarrow", "compressed-tensors==0.20.1", "gguf>=0.19"]  # gguf: the exporter's tests; pillow: image calibration tests; pyarrow: the hf source's parquet test; compressed-tensors: packing parity tests

[tool.hatch.build.targets.wheel]
packages = ["src/qda_quant"]

# Compiles the shipped C quantizer into the linux wheel; see hatch_build.py.
[tool.hatch.build.targets.wheel.hooks.custom]

[tool.hatch.build]
artifacts = ["src/qda_quant/data/*"]

[project.scripts]
qda = "qda_quant.cli:main"
